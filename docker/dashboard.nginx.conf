# Serves the built checkout and nothing else. One page, so an unknown path
# answers the page; the API is elsewhere and is never proxied through here.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  # The page calls the gateway at an address the visitor can change, so
  # connections are not pinned to one origin; everything else stays local.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' http: https:; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
